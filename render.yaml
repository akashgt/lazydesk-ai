services:
  - type: web
    name: lazydesk-ai
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && npm install && npm run build"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: HOSTED_DEMO
        value: "true"
      - key: OLLAMA_MODEL
        value: "gemma2:2b"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "20.18.0"
